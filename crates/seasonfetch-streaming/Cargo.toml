[package]
name = "seasonfetch-streaming"
version = "0.1.0"
edition = "2021"
description = "Reusable progressive BitTorrent-to-HTTP Range streaming & offline download engine powered by libtorrent 2.1.1 (stremio-native/stream-server)."
license = "UNLICENSED"

[dependencies]
seasonfetch-core = { path = "../seasonfetch-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
