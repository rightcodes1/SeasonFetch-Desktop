[package]
name = "seasonfetch-desktop"
version = "0.1.1-beta.8"
default-run = "seasonfetch-desktop"
description = "SeasonFetch Desktop — Tauri 2 + Rust + React Windows Media Application"
authors = ["SeasonFetch"]
edition = "2021"

[lib]
name = "seasonfetch_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
seasonfetch-core = { path = "../crates/seasonfetch-core" }
seasonfetch-streaming = { path = "../crates/seasonfetch-streaming" }
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
base64 = "0.22"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libloading = "0.8"
minisign-verify = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Memory", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader"] }
winreg = "0.55"
